<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 2 - Actividad 2</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <main id="act2">
        <p id="textoAct2" class="d-flex align-items-center justify-content-center mt-4">
            Puedes llevar hasta 10 stickers en total
        </p>
        <div id="stickersAct2" class="d-flex align-items-center justify-content-evenly">
            <span>
                <img src="./assets/img/sticker1.jpg" alt="">
                <input id="sticker1" type="number">
            </span>
            <span>
                <img src="./assets/img/sticker2.webp" alt="">
                <input id="sticker2" type="number">
            </span>
            <span>
                <img src="./assets/img/sticker3.webp" alt="">
                <input id="sticker3" type="number">
            </span>
        </div>
        <span id="verificarAct2" class="d-flex flex-column align-items-center justify-content-center">
            <p id="cantStickers"></p>
            <button 
            onclick="
            cantidad = document.querySelector('#cantStickers')
            total = Number(sticker1.value) + Number(sticker2.value) + Number(sticker3.value)
            
            if(total <= 10){
                cantidad.innerHTML = 'Llevas ' + total + ' stickers.'
            }
            else{
                cantidad.innerHTML = 'Llevas demasiados stickers.'
            }">
                Verificar
            </button>
        </span>
        <span id="botonVolver" class="d-flex align-items-center justify-content-center mt-3">
            <a href="index.html">
                <button class="btn btn-secondary">Volver a la página principal</button>
            </a>
        </span>
    </main>
</body>

</html>
